name: release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out the code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-app.sh "$VERSION"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(shasum -a 256 "dist/MagicStackBar-${VERSION}.zip" | cut -d' ' -f1)
          gh release create "$GITHUB_REF_NAME" \
            "dist/MagicStackBar-${VERSION}.zip" \
            --title "MagicStackBar ${VERSION}" \
            --notes "sha256: \`${SHA256}\`

homebrew-tap の Casks/magic-stack-bar.rb の version と sha256 を更新してください。"
